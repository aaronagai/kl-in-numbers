<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototype public data site for Kuala Lumpur: housing, homelessness, city services, floods, transport, environment, budget and people, by parliamentary seat. Sample data.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>[hidden]{display:none!important} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>KL in Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400&display=swap">
<style>
/* Layout: app shell. Warm sidebar (topics + areas) beside a white sheet. Home is a full-bleed map of KL's
   11 seats with a floating legend/list panel and a detail tray; each topic opens as its own page in the sheet. */
:root {
  --side: #F7F7F6;
  --sheet: #FFFFFF;
  --ink: #17181A;
  --ink-2: #3C3B37;
  --ink-3: #5C5B56;
  --muted: #6F6E68;
  --faint: #85847E;
  --line: rgba(23, 24, 26, .09);
  --hover: #F1F1F0;
  --active: #ECEBE7;
  --accent: #2231DD;
  --accent-soft: rgba(34, 49, 221, .08);
  --ramp-base: #FFFFFF;
  --on-accent: #FFFFFF;
  --amber: #B8431C;
  --canvas: #F7F7F6;
  --dot: #E3E2DE;
  --good: #15803D; --good-soft: rgba(21, 128, 61, .08);
  --warn: #5C5B56; --warn-soft: #F1F1F0;
  --bad: #B8431C;  --bad-soft: rgba(184, 67, 28, .08);
  --neutral-soft: #F1F1F0;
  --shadow: 0 1px 2px rgba(23, 24, 26, .05), 0 10px 30px rgba(23, 24, 26, .07);
  --f-ui: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-num: var(--f-ui);
  --f-data: var(--f-ui);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t-fast: 80ms; --t-mod: 160ms; --t-slow: 240ms;
  --x-fast: 60ms; --x-mod: 120ms; --x-slow: 160ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --side: #0F0F0F; --sheet: #000000; --ink: #FFFFFF; --ink-2: #B4B4B4; --ink-3: #9A9A9A; --muted: #828282; --faint: #6B6B6B;
    --line: rgba(255, 255, 255, .09); --hover: #181818; --active: #202020; --accent: #6B78FF; --accent-soft: rgba(107, 120, 255, .14); --ramp-base: #2A2A2C; --on-accent: #000000;
    --amber: #E8704A; --canvas: #0F0F0F; --dot: #1E1E1E;
    --good: #3FB86B; --good-soft: rgba(63, 184, 107, .12); --warn: #9A9A9A; --warn-soft: #181818; --bad: #E8704A; --bad-soft: rgba(232, 112, 74, .12);
    --neutral-soft: #181818; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --side: #0F0F0F; --sheet: #000000; --ink: #FFFFFF; --ink-2: #B4B4B4; --ink-3: #9A9A9A; --muted: #828282; --faint: #6B6B6B;
    --line: rgba(255, 255, 255, .09); --hover: #181818; --active: #202020; --accent: #6B78FF; --accent-soft: rgba(107, 120, 255, .14); --ramp-base: #2A2A2C; --on-accent: #000000;
    --amber: #E8704A; --canvas: #0F0F0F; --dot: #1E1E1E;
    --good: #3FB86B; --good-soft: rgba(63, 184, 107, .12); --warn: #9A9A9A; --warn-soft: #181818; --bad: #E8704A; --bad-soft: rgba(232, 112, 74, .12);
    --neutral-soft: #181818; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
}

* { box-sizing: border-box; }
b, strong, th, h1, h2, h3, h4, optgroup { font-weight: 400; }
body { font-feature-settings: "cv11", "ss01"; color: var(--ink); }

html, body { height: 100%; }
body { margin: 0; background: var(--side); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 18px; height: 18px; flex: none; display: block; }
.ico.sm { width: 16px; height: 16px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.sidebar { display: flex; flex-direction: column; min-height: 0; padding: 14px 10px 10px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.brand .mark { width: 26px; height: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.brand .mark i { border-radius: 2px; background: var(--accent); }
.brand .mark i:nth-child(2n) { opacity: .45; }
.brand .mark i:nth-child(3n) { opacity: .7; }
.brand b { font-family: var(--f-num); font-weight: 400; font-size: 17px; letter-spacing: -.01em; }

.nav { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 0 2px; scrollbar-width: thin; }
.nav-h { font-size: 13px; font-weight: 400; color: var(--ink); padding: 16px 10px 6px; }
.nav-item {
  position: relative; z-index: 1; width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px; text-align: left; color: var(--ink); font-size: 14px; height: 36px;
}
.nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .ico { color: var(--muted); }
.nav-item .ico-f { display: none; }
.nav-item.on .ico-o { display: none; }
.nav-item.on .ico-f { display: block; color: var(--ink); }
.nav-item .kbd { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.swatch { width: 18px; height: 18px; border-radius: 5px; flex: none; border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent); transition: background-color var(--t-mod) var(--ease); }
.nav-item.picked { font-weight: 400; }
.nav-item.picked .swatch { box-shadow: 0 0 0 2px var(--side), 0 0 0 3.5px var(--ink); }
.glide { position: absolute; left: 2px; right: 2px; top: 0; height: 36px; border-radius: 8px; pointer-events: none; z-index: 0; }
.glide.hl { background: var(--hover); opacity: 0; transition: transform var(--t-mod) var(--ease), opacity var(--x-fast) linear; }
.glide.hl.show { opacity: 1; transition: transform var(--t-mod) var(--ease), opacity var(--t-fast) linear; }
.glide.act { background: var(--active); transition: transform var(--t-mod) var(--ease), opacity var(--t-fast) linear; }
@media (hover: none) { .glide.hl { display: none; } }

.side-foot { padding: 10px 10px 4px; display: grid; gap: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
.proto { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted); line-height: 1.4; }
.proto b { display: inline-block; font-family: var(--f-data); font-weight: 400; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 6px; border-radius: 4px; flex: none; }

.sheet {
  margin: 8px 8px 8px 0; background: var(--sheet); border-radius: 14px; border: 1px solid var(--line);
  min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); min-height: 56px; }
.crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 15px; white-space: nowrap; overflow: hidden; }
.crumb .sep { color: var(--muted); font-weight: 400; }
.crumb .dim { color: var(--muted); font-weight: 400; }
.menu-btn { display: none; padding: 6px; border-radius: 8px; }
.menu-btn:hover { background: var(--hover); }
.area-select { position: relative; display: flex; align-items: center; }
.area-select[hidden] { display: none; }
.area-select select {
  appearance: none; font: inherit; font-size: 13px; font-weight: 400; color: var(--ink);
  background: var(--side); border: 1px solid var(--line); border-radius: 999px; padding: 6px 30px 6px 12px; cursor: pointer; max-width: 220px;
}
.area-select .ico { position: absolute; right: 9px; pointer-events: none; color: var(--muted); width: 14px; height: 14px; }

.viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; }
.view.enter { animation: viewIn var(--t-mod) var(--ease) both; }
.view.leave { animation: viewOut var(--x-mod) var(--ease) both; pointer-events: none; }
@keyframes viewIn { from { opacity: 0; transform: translateY(calc(var(--dir, 1) * 10px)); } to { opacity: 1; transform: none; } }
@keyframes viewOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(calc(var(--dir, 1) * -6px)); } }

/* ---------- map view ---------- */
.mapview { position: absolute; inset: 0; }
.canvas {
  position: absolute; inset: 0; overflow: hidden; cursor: grab;
  background-color: var(--canvas);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 18px 18px;
}
.canvas > svg { width: 100%; height: 100%; display: block; touch-action: none; }
@media (min-width: 901px) { .canvas > svg { width: calc(100% - 314px); margin-left: 314px; } }
.zoomg { transition: transform var(--t-slow) var(--ease); }
.zoomg.dragging { transition: none; }
.seat { stroke: var(--sheet); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill var(--t-mod) var(--ease), opacity var(--t-mod) var(--ease); }
.seat:hover { stroke: var(--ink); stroke-width: 1.5; }
.seat.sel { stroke: var(--ink); stroke-width: 2.5; }
.has-sel .seat:not(.sel) { opacity: .55; }
.seat-in { animation: seatIn var(--t-slow) var(--ease) both; }
@keyframes seatIn { from { opacity: 0; } to { opacity: 1; } }
.lab { font-family: var(--f-ui); font-weight: 400; fill: var(--ink); paint-order: stroke; stroke: color-mix(in oklab, var(--sheet) 85%, transparent); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; text-anchor: middle; }
.lab .v { font-family: var(--f-data); font-weight: 400; }
.edge-lab { font-family: var(--f-data); font-size: calc(var(--fs, 30) * .8px); fill: var(--muted); letter-spacing: .14em; text-transform: uppercase; pointer-events: none; }

.tip {
  position: absolute; z-index: 4; pointer-events: none; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; opacity: 0; transform: translateY(4px);
  transition: opacity var(--x-fast) linear, transform var(--x-fast) linear; white-space: nowrap;
}
.tip.show { opacity: 1; transform: none; transition: opacity var(--t-fast) linear, transform var(--t-fast) var(--ease); }
.tip b { display: block; font-size: 13px; }
.tip span { font-family: var(--f-data); color: var(--muted); }

.zoomctl { position: absolute; right: 14px; bottom: 14px; z-index: 3; display: grid; gap: 6px; }
.zoomctl button { width: 34px; height: 34px; display: grid; place-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 50%; box-shadow: var(--shadow); transition: background-color var(--t-fast) linear; }
.zoomctl button:hover { background: var(--hover); }

.mpanel {
  position: absolute; left: 14px; top: 14px; z-index: 3; width: 300px; max-height: calc(100% - 28px);
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.tabs { position: relative; display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
.tab { position: relative; z-index: 1; flex: 1; padding: 6px 10px; border-radius: 7px; font-size: 13px; font-weight: 400; color: var(--muted); transition: color var(--t-fast) linear; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab-ind { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 6px; border-radius: 7px; background: var(--hover); transition: transform var(--t-mod) var(--ease); }
.mpanel-body { overflow-y: auto; padding: 14px; display: grid; gap: 14px; min-height: 0; }
.mp-title { font-family: var(--f-num); font-weight: 400; font-size: 18px; line-height: 1.2; }
.mp-desc { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.more { color: var(--ink); font-weight: 400; font-size: 13px; padding: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.more-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-mod) var(--ease); }
.more-body > div { overflow: hidden; }
.more-body.open { grid-template-rows: 1fr; }
.more-body p { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.layer-h { font-size: 12px; font-weight: 400; color: var(--muted); margin-bottom: 6px; }
.layers { position: relative; display: grid; gap: 1px; }
.layer { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13px; height: 32px; }
.layer .ico { color: var(--muted); width: 16px; height: 16px; }
.layer[aria-pressed="true"] { font-weight: 400; }
.layer[aria-pressed="true"] .ico { color: var(--accent); }
.layers .glide { left: 0; right: 0; height: 32px; }
.legend { display: grid; gap: 4px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.legend span { font-family: var(--f-data); color: var(--muted); }

.rank { position: relative; display: grid; gap: 1px; }
.rank .glide { left: 0; right: 0; height: 40px; }
.rank-row { position: relative; z-index: 1; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; text-align: left; height: 40px; }
.rank-row .n { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.rank-row .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .mini { display: block; height: 3px; border-radius: 2px; background: var(--accent); margin-top: 3px; transform-origin: left; }
.rank-row .v { font-family: var(--f-data); font-size: 12px; }
.rank-row.picked .nm { font-weight: 400; }

/* tray */
.tray {
  position: absolute; z-index: 5; top: 14px; right: 14px; bottom: 14px; width: 340px;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 20px)); visibility: hidden;
  transition: transform var(--x-mod) var(--ease), visibility 0s linear var(--x-mod);
}
.tray.open { transform: none; visibility: visible; transition: transform var(--t-mod) var(--ease), visibility 0s; }
.tray-h { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.tray-h .t { flex: 1; min-width: 0; }
.tray-h .code { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.tray-h h2 { margin: 2px 0 0; font-family: var(--f-num); font-weight: 400; font-size: 24px; line-height: 1.1; }
.tray-h p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.icon-btn { padding: 6px; border-radius: 8px; color: var(--muted); transition: background-color var(--t-fast) linear; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.tray-b { overflow-y: auto; padding: 8px; position: relative; flex: 1; min-height: 0; }
.trow { position: relative; z-index: 1; width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 8px; border-radius: 8px; text-align: left; }
.trow .ico { color: var(--muted); grid-row: span 2; align-self: start; margin-top: 2px; }
.trow .k { font-size: 12px; color: var(--muted); }
.trow .v { font-family: var(--f-num); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; grid-column: 2; }
.trow .chip { grid-column: 3; grid-row: 1 / span 2; }
.tray-b .glide { left: 8px; right: 8px; }
.tray-f { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--sheet); font-weight: 400; font-size: 13px; transition: opacity var(--t-fast) linear; }
.btn:hover { opacity: .88; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 400; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.neutral { background: var(--neutral-soft); color: var(--muted); }

/* ---------- topic view ---------- */
.page { max-width: 1040px; margin: 0 auto; padding: 28px 28px 48px; }
.page-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: end; margin-bottom: 18px; }
.page-h > .chip { justify-self: start; }
.eyebrow { font-family: var(--f-data); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.page-h h1 { margin: 6px 0 0; font-family: var(--f-num); font-weight: 400; font-size: clamp(30px, 4vw, 44px); line-height: 1; letter-spacing: -.015em; text-wrap: balance; }
.page-h .q { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.summary { font-size: 17px; line-height: 1.55; max-width: 62ch; margin: 0 0 20px; text-wrap: pretty; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--f-num); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .s { font-size: 12px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h3 { margin: 0; font-size: 14px; font-weight: 400; }
.panel .sub { font-size: 12px; color: var(--muted); margin: 2px 0 12px; }
.panel svg { width: 100%; height: auto; display: block; overflow: visible; }
.source { margin-top: 16px; font-size: 12px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; }
.source b { font-weight: 400; color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager button { display: grid; gap: 2px; text-align: left; padding: 8px 10px; border-radius: 8px; transition: background-color var(--t-fast) linear; }
.pager button:hover { background: var(--hover); }
.pager button:last-child { text-align: right; margin-left: auto; }
.pager small { font-size: 11px; color: var(--muted); }
.pager span { font-weight: 400; }

.bars { position: relative; display: grid; gap: 2px; }
.bars .glide { left: 0; right: 0; height: 26px; }
.bar-row { position: relative; z-index: 1; display: grid; grid-template-columns: 116px minmax(0, 1fr) 64px; gap: 8px; align-items: center; height: 26px; padding: 0 6px; border-radius: 6px; text-align: left; font-size: 13px; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row.picked .nm { font-weight: 400; }
.bar-track { position: relative; height: 10px; }
.bar-fill { position: absolute; inset: 0; border-radius: 3px; background: color-mix(in oklab, var(--accent) 38%, var(--ramp-base)); transform-origin: left center; transition: transform var(--t-slow) var(--ease), background-color var(--t-mod) linear; }
.bar-row.picked .bar-fill, .cat-row .bar-fill { background: var(--accent); }
.bar-row .bv, .cat-row .bv { font-family: var(--f-data); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.ref { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--amber); }
.reflegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.reflegend i { display: inline-block; width: 14px; border-top: 1.5px dashed var(--amber); vertical-align: middle; margin-right: 5px; }
.cat-row { display: grid; grid-template-columns: 140px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }

.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 150px; }
.months div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; min-width: 0; }
.months i { display: block; width: 100%; border-radius: 3px 3px 0 0; background: var(--accent); }
.months i.wet { background: var(--amber); }
.months span { font-family: var(--f-data); font-size: 10px; color: var(--muted); }
.months b { font-family: var(--f-data); font-size: 10px; font-weight: 400; }
.stack { display: flex; height: 24px; border-radius: 6px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
.stack div { min-width: 3px; }
.stack-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; font-size: 12px; margin-bottom: 14px; }
.stack-legend span { display: flex; gap: 6px; align-items: center; min-width: 0; }
.stack-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.stack-legend em { font-style: normal; margin-left: auto; font-family: var(--f-data); color: var(--muted); }
.airyears { display: grid; gap: 6px; }
.airyears .yr { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; }
.airyears .stack { margin: 0; height: 14px; border-radius: 3px; }
.hotspots { list-style: none; margin: 0; padding: 0; }
.hotspots li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; }
.hotspots li:last-child { border-bottom: 0; }
.hotspots .where { color: var(--muted); font-size: 12px; }
.empty-note { color: var(--muted); font-size: 13px; padding: 8px 0; margin: 0; }
.progress { position: relative; height: 16px; background: var(--neutral-soft); border-radius: 8px; margin: 26px 0 32px; }
.progress .fill { position: absolute; inset: 0; background: var(--accent); border-radius: 8px; transform-origin: left center; transition: transform var(--t-slow) var(--ease); }
.progress .mark { position: absolute; top: -6px; bottom: -6px; border-left: 1.5px dashed var(--amber); }
.progress .mark span { position: absolute; top: -18px; left: 4px; font-size: 11px; white-space: nowrap; color: var(--muted); }
.progress .mark.end span { left: auto; right: 4px; }
.progress .now { position: absolute; top: 22px; font-size: 12px; font-family: var(--f-data); transform: translateX(-50%); white-space: nowrap; }

.ax { font-family: var(--f-data); font-size: 11px; fill: var(--muted); }
.ax-strong { font-family: var(--f-data); font-size: 12px; fill: var(--ink); font-weight: 400; }
.grid { stroke: var(--line); stroke-width: 1; }
.ln { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.ar { fill: var(--accent); opacity: .12; }
.gap { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.dot { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.pop { animation: pop var(--t-slow) var(--ease); }
@keyframes pop { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* about */
.about h2 { font-family: var(--f-num); font-weight: 400; font-size: 20px; margin: 28px 0 10px; }
.about p { max-width: 64ch; font-size: 15px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 400; color: var(--muted); background: var(--side); }
tr:last-child td { border-bottom: 0; }
.asks { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; counter-reset: a; }
.asks li { counter-increment: a; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 15px; max-width: 70ch; }
.asks li::before { content: counter(a); font-family: var(--f-data); font-size: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

.scrim { display: none; }


/* Type in one weight: hierarchy comes from size and from black vs grey ink */
.brand b { color: var(--ink); letter-spacing: -.02em; }
.brand .mark i { background: var(--ink); }
.nav-item { color: var(--ink-3); }
.nav-item:hover, .nav-item.on, .nav-item.picked { color: var(--ink); }
.nav-item .kbd { color: var(--faint); }
.nav-h { color: var(--faint); font-size: 12px; }
.proto b { color: var(--ink-3); background: var(--hover); }
.proto span { color: var(--faint); }
.crumb { color: var(--ink); }
.crumb .dim, .crumb .sep { color: var(--faint); }
.mp-title { color: var(--ink); letter-spacing: -.015em; }
.mp-desc, .layer-h { color: var(--faint); }
.layer { color: var(--ink-3); }
.layer:hover, .layer[aria-pressed="true"] { color: var(--ink); }
.rank-row .nm, .bar-row .nm { color: var(--ink-3); }
.rank-row.picked .nm, .bar-row.picked .nm, .rank-row:hover .nm, .bar-row:hover .nm { color: var(--ink); }
.rank-row .v, .bar-row .bv, .cat-row .bv { color: var(--ink); }
.cat-row > span:first-child { color: var(--ink-3); }
.legend span { color: var(--ink-3); }
.tray-h h2 { letter-spacing: -.025em; color: var(--ink); }
.tray-h p, .tray-h .code { color: var(--faint); }
.trow .k { color: var(--faint); }
.trow .v { color: var(--ink); letter-spacing: -.015em; }
.eyebrow { color: var(--faint); letter-spacing: .06em; }
.page-h h1 { letter-spacing: -.035em; color: var(--ink); }
.page-h .q { color: var(--ink-3); }
.summary { color: var(--ink-3); }
.summary strong { color: var(--ink); }
.stat .k { color: var(--muted); }
.stat .v { color: var(--ink); letter-spacing: -.025em; font-size: 30px; }
.stat .s, .panel .sub, .source { color: var(--faint); }
.source b { color: var(--ink-2); }
.panel h3 { color: var(--ink); }
.about p, .asks li { color: var(--ink-3); }
.about p strong { color: var(--ink); }
.about h2 { color: var(--ink); letter-spacing: -.02em; }
th { color: var(--faint); }
td { color: var(--ink-3); }
td:first-child { color: var(--ink); }
.pager small { color: var(--faint); }
.pager span { color: var(--ink); }
.lab { fill: var(--ink); }
.lab .v { fill: var(--ink-3); }
.tip b { color: var(--ink); }
.tip span { color: var(--faint); }
.chip { letter-spacing: 0; }

/* overview bento */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(168px, auto); gap: 12px; }
.bc {
  grid-column: span 1; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0;
  padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--sheet);
  transition: background-color var(--t-fast) linear, transform var(--t-mod) var(--ease), border-color var(--t-fast) linear;
}
.bc:hover { background: var(--side); border-color: color-mix(in oklab, var(--ink) 16%, transparent); transform: translateY(-2px); }
.bc:active { transform: scale(.99); }
.bc.w2 { grid-column: span 2; }
.bc.h2 { grid-row: span 2; }
.bc-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; }
.bc-lbl { white-space: nowrap; }
.bc-lbl { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }
.bc-big { color: var(--ink); font-size: 40px; line-height: 1; letter-spacing: -.04em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.bc.hero .bc-big { font-size: 72px; letter-spacing: -.05em; }
.bc-big.sm { font-size: 28px; margin-top: 0; }
.bc-u { color: var(--ink-3); font-size: 13px; }
.bc-viz { margin-top: auto; padding-top: 12px; display: block; }
.bc-viz svg { width: 100%; display: block; overflow: visible; }
.bc-prog { display: block; height: 10px; border-radius: 5px; background: var(--hover); position: relative; overflow: hidden; }
.bc-prog i { position: absolute; inset: 0; background: var(--accent); border-radius: 5px; transform-origin: left; transition: transform var(--t-slow) var(--ease); }
.bc-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--faint); margin-top: 8px; }
.bc .stack { margin: 0; height: 14px; border-radius: 4px; display: flex; }
.bc-mapwrap { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: auto; }
.minimap { width: 96px; height: auto; display: block; }
.minimap path { stroke: var(--sheet); stroke-width: 6; }
.minimap path.sel { stroke: var(--ink); stroke-width: 10; }
.bc-mapwrap > span { display: grid; gap: 6px; }
@media (max-width: 1100px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bc.h2 { grid-row: span 1; } .bc.hero .bc-big { font-size: 56px; } }
@media (max-width: 560px) { .bento { grid-template-columns: minmax(0, 1fr); } .bc.w2 { grid-column: span 1; } .bc-big { font-size: 34px; } .bc.hero .bc-big { font-size: 48px; } }


/* language switch */
.lang { position: relative; display: flex; flex: none; padding: 2px; border-radius: 999px; background: var(--side); border: 1px solid var(--line); }
.lang button { position: relative; z-index: 1; padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--faint); transition: color var(--t-fast) linear; }
.lang button[aria-pressed="true"] { color: var(--ink); }
.lang .ind { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 999px; background: var(--sheet); box-shadow: 0 1px 2px rgba(23, 24, 26, .1); transition: transform var(--t-mod) var(--ease), width var(--t-mod) var(--ease); }

/* thermal heat map */
.panel.wide { grid-column: 1 / -1; }
.heat { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 28px; align-items: start; }
.heat-cv { position: relative; }
.heat-cv canvas { display: block; width: 100%; }
.heat-ring { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: 0; pointer-events: none; transition: transform var(--t-mod) var(--ease), opacity var(--x-fast) linear; }
.heat-tip { position: absolute; pointer-events: none; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 9px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity var(--x-fast) linear; }
.heat-tip b { display: block; color: var(--ink); }
.heat-tip span { color: var(--faint); }
.heat-cv.hot .heat-ring, .heat-cv.hot .heat-tip { opacity: 1; transition: transform var(--t-mod) var(--ease), opacity var(--t-fast) linear; }
.heat-side { display: grid; gap: 14px; min-width: 0; }
.heat-legend { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12px; color: var(--faint); }
.heat-legend i { display: block; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(70, 92, 235), rgb(72, 190, 250) 35%, rgb(255, 214, 72) 60%, rgb(255, 122, 140) 82%, rgb(236, 52, 96)); }
.heat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.heat-list li { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.heat-list li:last-child { border-bottom: 0; }
.heat-list .hn { color: var(--ink); font-size: 13px; display: grid; min-width: 0; }
.heat-list .hn small { color: var(--faint); font-size: 11px; }
.heat-list .hb { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.heat-list .hb i { display: block; height: 100%; background: linear-gradient(90deg, rgb(72, 190, 250), rgb(255, 214, 72), rgb(236, 52, 96)); transform-origin: left; }
.heat-list .hv { text-align: right; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bc-split { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 16px; align-items: end; }
.bc-split canvas { width: 76px; display: block; }
@media (max-width: 760px) { .heat { grid-template-columns: minmax(0, 1fr); } .heat-cv { max-width: 340px; margin: 0 auto; width: 100%; } }


/* street basemap */
.ml { position: absolute; inset: 0; }
.canvas:has(.ml) { cursor: auto; background: var(--canvas); }
.maplibregl-ctrl-bottom-left { margin: 0 0 6px 330px; display: flex; align-items: flex-end; gap: 8px; }
.maplibregl-ctrl-scale { background: transparent; border-color: var(--ink-3); color: var(--ink-3); font: 11px var(--f-ui); }
.maplibregl-ctrl-attrib { font: 11px var(--f-ui); background: color-mix(in oklab, var(--sheet) 80%, transparent) !important; color: var(--faint); }
.maplibregl-ctrl-attrib a { color: var(--ink-3); }
.pts { display: grid; gap: 6px; }
.pt { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); text-align: left; padding: 4px 0; }
.pt[aria-pressed="true"] { color: var(--ink); }
.pt .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; transition: background-color var(--t-fast) linear, border-color var(--t-fast) linear; }
.pt[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
.pt[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 4px; border: 1.5px solid var(--sheet); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pt-key { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-left: 26px; font-size: 12px; color: var(--faint); }
.pt-key span { display: flex; align-items: center; gap: 6px; }
.pt-key i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--sheet); }
@media (max-width: 900px) { .maplibregl-ctrl-bottom-left { margin-left: 8px; } }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(290px, 86vw); background: var(--side);
    padding-top: calc(14px + env(safe-area-inset-top, 0px)); box-shadow: var(--shadow);
    transform: translateX(-102%); transition: transform var(--x-mod) var(--ease);
  }
  .app.nav-open .sidebar { transform: none; transition: transform var(--t-mod) var(--ease); }
  .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0, 0, 0, .28); opacity: 0; pointer-events: none; transition: opacity var(--x-mod) linear; }
  .app.nav-open .scrim { opacity: 1; pointer-events: auto; transition: opacity var(--t-mod) linear; }
  .sheet { margin: 0; border-radius: 0; border: 0; }
  .menu-btn { display: block; }
  .topbar { padding: 10px 12px; }
  .mapview { overflow-y: auto; }
  .canvas { position: relative; inset: auto; height: 58vh; }
  .mpanel { position: relative; left: auto; top: auto; width: auto; max-height: none; margin: 12px 16px 24px; box-shadow: none; }
  .tray { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; border-radius: 16px 16px 0 0; transform: translateY(102%); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tray.open { transform: none; }
  .charts { grid-template-columns: minmax(0, 1fr); }
  .page { padding: 22px 16px 40px; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: minmax(0, 1fr); }
  .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
  .page-h { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: 92px minmax(0, 1fr) 54px; }
  .cat-row { grid-template-columns: 112px minmax(0, 1fr) 48px; }
  .stack-legend { grid-template-columns: minmax(0, 1fr); }
  .area-select select { max-width: 150px; }
  .crumb .dim, .crumb .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  .view.enter, .view.leave { animation-name: fadeOnly !important; animation-duration: var(--t-fast) !important; }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><b>KL in Numbers</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="proto"><b>Prototype</b><span>All figures are sample data for illustration, not official statistics.</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="sheet">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation"></button>
      <div class="crumb" id="crumb"></div>
      <label class="area-select"><span class="sr" hidden>Area</span><select id="areaSel" aria-label="Area"></select><span id="areaChev"></span></label>
      <div class="lang" id="lang" role="group" aria-label="Language"><span class="ind"></span><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="bm" aria-pressed="false">BM</button></div>
    </header>
    <div class="viewport" id="viewport"></div>
  </main>
</div>

/* ---------- data helpers ---------- */
function int(v) { return Math.round(v).toLocaleString("en-MY"); }
function seatBy(code) { return SEATS.find(s => s.code === code); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function klValue(key) {
  if (KL_OVERRIDE[key] != null) return KL_OVERRIDE[key];
  if (SUM_KEYS.includes(key)) return SEATS.reduce((a, s) => a + s[key], 0);
  if (key === "resolveDays") { const w = SEATS.reduce((a, s) => a + s.complaints, 0); return SEATS.reduce((a, s) => a + s.resolveDays * s.complaints, 0) / w; }
  const w = SEATS.reduce((a, s) => a + s.pop, 0);
  return SEATS.reduce((a, s) => a + s[key] * s.pop, 0) / w;
}
function val(key, where = state.area) { return where === "KL" ? klValue(key) : seatBy(where)[key]; }
function series(key, where = state.area) {
  const base = SERIES[key];
  if (where === "KL") return base;
  const ratio = val(key, where) / base[base.length - 1];
  return base.map(v => v == null ? null : v * ratio);
}
function areaLabel(where = state.area) { return where === "KL" ? "Kuala Lumpur" : seatBy(where).name; }
function pctChange(a, b) { return (b - a) / a * 100; }
function lastTwo(arr) { const v = arr.filter(x => x != null); return [v[v.length - 2], v[v.length - 1]]; }
function comparable(key, where) { const v = val(key, where); return PER_CAP.includes(key) ? v / val("pop", where) * 1e4 : v; }
function status(t, where = state.area) {
  if (t.lower == null) {
    if (where !== "KL") { const share = val(t.key, where) / (t.key === "budget" ? SEATS.reduce((a, s) => a + s.budget, 0) : klValue(t.key)) * 100; return { cls: "neutral", text: tr("{n}% of KL", { n: share.toFixed(0) }) }; }
    const [a, b] = lastTwo(SERIES[t.key]); const ch = pctChange(a, b);
    return { cls: "neutral", text: tr("{n}% on 2025", { n: (ch >= 0 ? "+" : "") + ch.toFixed(1) }) };
  }
  if (where === "KL") {
    const [a, b] = lastTwo(SERIES[t.key]); const ch = pctChange(a, b);
    const better = t.lower ? ch < -1 : ch > 1, worse = t.lower ? ch > 1 : ch < -1;
    return { cls: better ? "good" : worse ? "bad" : "warn", text: tr(better ? "Improving" : worse ? "Getting worse" : "Holding steady") };
  }
  const mine = comparable(t.key, where), kl = comparable(t.key, "KL"), diff = (mine - kl) / kl;
  if (Math.abs(diff) < 0.1) return { cls: "warn", text: tr("Near KL average") };
  const better = t.lower ? diff < 0 : diff > 0;
  return { cls: better ? "good" : "bad", text: tr(better ? "Better than average" : "Worse than average") };
}
function layerVal(L, s) { return L.perCap ? s[L.key] / s.pop * 1e4 : s[L.key]; }
function bins(L) {
  const vs = SEATS.map(s => layerVal(L, s)); const lo = Math.min(...vs), hi = Math.max(...vs);
  const edges = [0, 1, 2, 3, 4, 5].map(i => lo + (hi - lo) * i / 5);
  return { edges, binOf: v => Math.min(4, Math.floor((v - lo) / ((hi - lo) / 5 || 1))) };
}
function binColor(i) { return `color-mix(in oklab, var(--accent) ${BIN_MIX[i]}%, var(--ramp-base))`; }

/* ---------- fluid hover: one shared highlight glides to the nearest item ---------- */
function fluid(container, itemSel) {
  let hl = container.querySelector(":scope > .glide.hl");
  if (!hl) { hl = document.createElement("span"); hl.className = "glide hl"; container.prepend(hl); }
  const move = it => { hl.style.height = it.offsetHeight + "px"; hl.style.transform = `translateY(${it.offsetTop}px)`; };
  container.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const it = e.target.closest(itemSel); if (!it || !container.contains(it)) return;
    if (!hl.classList.contains("show")) { hl.style.transition = "none"; move(it); void hl.offsetWidth; hl.style.transition = ""; }
    move(it); hl.classList.add("show");
  });
  container.addEventListener("pointerleave", () => hl.classList.remove("show"));
  container.addEventListener("focusin", e => { const it = e.target.closest(itemSel); if (it && e.target.matches(":focus-visible")) { move(it); hl.classList.add("show"); } });
  container.addEventListener("focusout", () => hl.classList.remove("show"));
}

/* ---------- sidebar ---------- */
function renderNav() {
  const nav = document.getElementById("nav");
  const item = (attrs, ico, label, extra = "") => `<button type="button" class="nav-item" ${attrs}>${ico}<span class="lbl">${label}</span>${extra}</button>`;
  const twin = name => icon(name, "ico-o") + icon(name, "ico-f", "F");
  nav.innerHTML = `<span class="glide act"></span>` +
    item(`data-view="overview"`, twin("overview"), tr("Overview")) +
    item(`data-view="map"`, twin("map"), tr("Map")) +
    item(`data-view="about"`, twin("info"), tr("About this data")) +
    `<div class="nav-h">${tr("Topics")}</div>` +
    TOPICS.map(t => item(`data-view="${t.id}"`, twin(t.icon), tr(t.label))).join("") +
    `<div class="nav-h">${tr("Areas")}</div>` +
    item(`data-area="KL"`, `<span class="swatch" data-sw="KL"></span>`, tr("All of Kuala Lumpur")) +
    SEATS.map(s => item(`data-area="${s.code}"`, `<span class="swatch" data-sw="${s.code}"></span>`, s.name, `<span class="kbd">${s.code.slice(2)}</span>`)).join("");
  if (!nav.dataset.fluid) { fluid(nav, ".nav-item"); nav.dataset.fluid = "1"; }
}
function syncNav(animate = true) {
  const nav = document.getElementById("nav");
  nav.querySelectorAll("[data-view]").forEach(b => { const on = b.dataset.view === state.view; b.classList.toggle("on", on); b.setAttribute("aria-current", on ? "page" : "false"); });
  nav.querySelectorAll("[data-area]").forEach(b => b.classList.toggle("picked", b.dataset.area === state.area));
  const act = nav.querySelector(".glide.act"), cur = nav.querySelector(`[data-view="${state.view}"]`);
  if (!animate) act.style.transition = "none";
  act.style.transform = `translateY(${cur.offsetTop}px)`;
  if (!animate) { void act.offsetWidth; act.style.transition = ""; }
  const L = LAYERS.find(l => l.key === state.layer), b = bins(L);
  nav.querySelectorAll("[data-sw]").forEach(sw => {
    const c = sw.dataset.sw;
    sw.style.background = c === "KL" ? `linear-gradient(135deg, ${binColor(0)}, ${binColor(4)})` : binColor(b.binOf(layerVal(L, seatBy(c))));
  });
}

/* ---------- charts ---------- */
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / mag;
  const step = (e < 1.5 ? 1 : e < 3 ? 2 : e < 7 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let x = a; x <= b + step / 2; x += step) t.push(+x.toFixed(6));
  return t;
}
function shortNum(v) {
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, "") + (state.lang === "bm" ? "j" : "m");
  if (Math.abs(v) >= 1e4) return (v / 1e3).toFixed(0) + "k";
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function lineChart(vals, { fmt = shortNum, zero = false, gapLabel = tr("Not measured") } = {}) {
  const W = 560, H = 230, pl = 46, pr = 18, pt = 20, pb = 30;
  const nums = vals.filter(v => v != null);
  let lo = Math.min(...nums), hi = Math.max(...nums);
  if (zero) lo = 0; else { const pad = (hi - lo) * 0.2 || 1; lo = Math.max(0, lo - pad); hi += pad; }
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const x = i => pl + i * (W - pl - pr) / (vals.length - 1), y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let o = "";
  ticks.forEach(t => { o += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  YEARS.forEach((yr, i) => { o += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${yr}</text>`; });
  const runs = []; let cur = [];
  vals.forEach((v, i) => { if (v == null) { if (cur.length) runs.push(cur); cur = []; } else cur.push(i); });
  if (cur.length) runs.push(cur);
  for (let r = 0; r < runs.length - 1; r++) {
    const a = runs[r][runs[r].length - 1], b = runs[r + 1][0];
    o += `<path class="gap" d="M${x(a)} ${y(vals[a])} L${x(b)} ${y(vals[b])}"/><text class="ax" x="${(x(a) + x(b)) / 2}" y="${(y(vals[a]) + y(vals[b])) / 2 - 10}" text-anchor="middle">${gapLabel}</text>`;
  }
  runs.forEach(run => {
    const d = run.map((i, k) => (k ? "L" : "M") + x(i).toFixed(1) + " " + y(vals[i]).toFixed(1)).join(" ");
    if (run.length > 1 && runs.length === 1) o += `<path class="ar" d="${d} L${x(run[run.length - 1])} ${y(y0)} L${x(run[0])} ${y(y0)} Z"/>`;
    o += `<path class="ln" d="${d}"/>`;
    if (run.length === 1) o += `<circle class="dot" cx="${x(run[0])}" cy="${y(vals[run[0]])}" r="4"/>`;
  });
  const li = vals.length - 1;
  o += `<circle class="dot" cx="${x(li)}" cy="${y(vals[li])}" r="5"/><text class="ax-strong" x="${x(li) - 8}" y="${y(vals[li]) - 12}" text-anchor="end">${fmt(vals[li])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${o}</svg>`;
}
function seatBars(key, { fmt = v => int(v), refs = [], perCap = false } = {}) {
  const rows = SEATS.map(s => ({ s, v: perCap ? s[key] / s.pop * 1e4 : s[key] })).sort((a, b) => b.v - a.v);
  const max = Math.max(...rows.map(r => r.v), ...refs.map(r => r.v)) * 1.05;
  const refHtml = refs.map(r => `<span class="ref" style="left:${r.v / max * 100}%"></span>`).join("");
  const legend = refs.length ? `<div class="reflegend">${refs.map(r => `<span><i></i>${esc(r.label)}</span>`).join("")}</div>` : "";
  return legend + `<div class="bars" data-fluid>${rows.map(r => { const s = (r.v / max).toFixed(4); return `<button type="button" class="bar-row${r.s.code === state.area ? " picked" : ""}" data-pick="${r.s.code}" aria-label="${esc(tr("Show {name}", { name: r.s.name }))}"><span class="nm">${esc(r.s.name)}</span><span class="bar-track"><span class="bar-fill" data-k="${key}-${r.s.code}" data-s="${s}" style="transform:scaleX(${s})"></span>${refHtml}</span><span class="bv">${fmt(r.v)}</span></button>`; }).join("")}</div>`;
}
function stackBar(parts, total, fmt) {
  return `<div class="stack">${parts.map(p => `<div style="flex:${p[1]};background:${p[2]}" title="${esc(tr(p[0]))}"></div>`).join("")}</div>
  <div class="stack-legend">${parts.map(p => `<span><i style="background:${p[2]}"></i>${esc(tr(p[0]))}<em>${fmt(p[1] * total)}</em></span>`).join("")}</div>`;
}
function catRows(rows, fmt, keyPrefix) {
  const max = Math.max(...rows.map(r => r[1]));
  return rows.map(([k, v]) => { const s = (v / max).toFixed(4); return `<div class="cat-row"><span>${tr(k)}</span><span class="bar-track"><span class="bar-fill" data-k="${keyPrefix}-${k}" data-s="${s}" style="transform:scaleX(${s})"></span></span><span class="bv">${fmt(v)}</span></div>`; }).join("");
}

function vsKL(key, unitWord) {

  const u = unitWord ? tr(" per resident") : "";
  if (Math.abs(d) < 10) return tr(" That's close to the KL average{u}.", { u });
  return tr(" That's {d}% {dir} than the KL average{u}.", { d: Math.abs(d).toFixed(0), dir: tr(d > 0 ? "higher" : "lower"), u });
}
const RENDER = {

  },
  homeless() {
    const n = val("homeless"), share = n / klValue("homeless") * 100;
    return { q: tr("How many people are sleeping rough, and is there room for them?"),

function sparkline(vals, h = 44) {

const SPOTS = [["Chow Kit", 578.7, 557.6, 60, "P.120"], ["Masjid Jamek", 562.0, 659.3, 45, "P.120"], ["Pasar Seni", 558.5, 683.1, 35, "P.120"], ["Pudu Sentral", 590.5, 683.1, 30, "P.120"], ["Medan Tuanku", 580.7, 589.6, 20, "P.120"], ["Bukit Bintang", 666.4, 676.1, 12, "P.120"], ["Brickfields", 497.2, 763.9, 7, "P.120"], ["Jalan TAR", 563.3, 610.5, 5, "P.120"], ["Kampung Baru", 619.0, 561.8, 60, "P.119"], ["Titiwangsa", 724.6, 548.0, 36, "P.119"], ["Sentul", 528.5, 415.4, 38, "P.115"], ["Bangsar", 389.3, 791.8, 31, "P.121"], ["Cheras", 779.1, 833.6, 57, "P.123"], ["Kepong", 145.7, 234.1, 12, "P.114"], ["Jalan Klang Lama", 438.0, 966.1, 44, "P.122"], ["Wangsa Maju", 848.7, 269.0, 21, "P.116"], ["Segambut", 347.6, 387.5, 25, "P.117"], ["Setiawangsa", 834.8, 457.2, 14, "P.118"], ["Bandar Tun Razak", 730.4, 1035.8, 18, "P.124"]];

}
function seatPaths(scale) { return SEATS.map(s => { const p = new Path2D(); p.addPath(new Path2D(GEO.seats[s.code].d), new DOMMatrix().scale(scale)); return [s.code, p]; }); }

  cv.style.height = cssH + "px"; cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext("2d"), s = cv.width / W, mini = "mini" in cv.dataset, sel = cv.dataset.area || "KL";

  const fw = mini ? 70 : 170, fh = Math.round(fw * H / W), fs = fw / W, f = document.createElement("canvas");
  f.width = fw; f.height = fh;

  for (const [, x, y, c] of SPOTS) {
    const cx = (x + HEAT_PAD) * fs, cy = (y + HEAT_PAD) * fs, r = (55 + 125 * Math.sqrt(c / max)) * fs, a = Math.min(1, (0.12 + 0.85 * c / max) * warm);
    const g = fx.createRadialGradient(cx, cy, 0, cx, cy, r);

  ctx.save(); ctx.filter = `blur(${(mini ? 2 : 5) * dpr}px)`; ctx.globalAlpha = 0.5; ctx.fillStyle = css.getPropertyValue("--faint").trim() || "#888"; ctx.fill(all); ctx.restore();
  ctx.save(); ctx.clip(all); ctx.filter = `blur(${(mini ? 1.5 : 4) * dpr}px)`; ctx.imageSmoothingEnabled = true;

document.addEventListener("pointermove", e => {
  const wrap = e.target.closest?.(".heat-cv");
  document.querySelectorAll(".heat-cv.hot").forEach(w => { if (w !== wrap) w.classList.remove("hot"); });
  if (!wrap) return;
  const cv = wrap.querySelector("canvas"), r = cv.getBoundingClientRect(), W = GEO.w + HEAT_PAD * 2;
  const ux = (e.clientX - r.left) / r.width * W - HEAT_PAD, uy = (e.clientY - r.top) / r.width * W - HEAT_PAD;
  let best = null, bd = 70;
  for (const p of SPOTS) { const dd = Math.hypot(p[1] - ux, p[2] - uy); if (dd < bd) { bd = dd; best = p; } }
  if (!best) { wrap.classList.remove("hot"); return; }
  const px = (best[1] + HEAT_PAD) / W * r.width, py = (best[2] + HEAT_PAD) / W * r.width;
  const ring = wrap.querySelector(".heat-ring"), tip = wrap.querySelector(".heat-tip");
  ring.style.transform = `translate(${px}px, ${py}px)`;
  tip.innerHTML = `<b>${esc(best[0])}</b><span>${tr("{n} people", { n: int(best[3]) })} · ${esc(seatBy(best[4]).name)}</span>`;
  tip.style.left = Math.min(px + 14, r.width - tip.offsetWidth) + "px"; tip.style.top = Math.max(0, py - tip.offsetHeight - 12) + "px";
  wrap.classList.add("hot");
});

    el.classList.add("enter");
  }
  vp.appendChild(el);
  el.querySelectorAll(".bars[data-fluid]").forEach(c => fluid(c, ".bar-row"));
  hydrate(el);
  if (ML && v !== "map") { const m = ML; ML = null; setTimeout(() => m.remove(), 140); }
  if (v === "map") {
    let ok = false;
    if (mlUsable()) { try { mlInit(el.querySelector("#ml")); ok = true; } catch (e) { mlFailed = true; ML = null; } }
    if (ok) { renderPanel(); bindMap(); syncTray(); }
    else {
      // no WebGL: fall back to the drawn seat map
      el.querySelector("#ml")?.remove(); el.querySelector("#zFit")?.remove();
      const svg = el.querySelector("#canvas > svg"); if (svg) svg.hidden = false;
      renderPanel(); paintMap(); applyZoom(); bindMap(); syncTray();
    }
  }
}
function go(v) {
  if (v === state.view) { closeNav(); return; }
  const dir = VIEW_ORDER.indexOf(v) >= VIEW_ORDER.indexOf(state.view) ? 1 : -1;
  state.view = v; closeNav();
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
  mountView(v, dir); renderTopbar(); syncNav();
}
function setArea(code) {
  if (code === state.area) code = state.view === "map" ? "KL" : code;
  const prev = snapshot();
  state.area = code;
  try { localStorage.setItem("klin-area", code); } catch (e) {}
  renderTopbar(); syncNav();
  if (state.view === "map") { paintMap(); zoomTo(code); syncTray(); if (state.tab === "list") renderPanel(); }
  else if (state.view !== "about") {
    const cur = document.querySelector("#viewport .view:not(.leave)"), scroll = cur.scrollTop;
    cur.innerHTML = viewHTML(state.view); cur.scrollTop = scroll;
    cur.querySelectorAll(".bars[data-fluid]").forEach(c => fluid(c, ".bar-row"));
    hydrate(cur, false);
  }
  continuity(prev);
}
function applyStatic() {
  document.documentElement.lang = state.lang === "bm" ? "ms" : "en";
  document.title = tr("KL in Numbers");
  document.querySelector(".brand b").textContent = tr("KL in Numbers");
  document.querySelector(".proto b").textContent = tr("Prototype");
  document.querySelector(".proto span").textContent = tr("All figures are sample data for illustration, not official statistics.");
  document.getElementById("menuBtn").setAttribute("aria-label", tr("Open navigation"));
  document.getElementById("areaSel").setAttribute("aria-label", tr("Area"));
  document.getElementById("lang").setAttribute("aria-label", tr("Language"));
  const sel = document.getElementById("areaSel");
  sel.innerHTML = `<option value="KL">${tr("All of KL")}</option>` + SEATS.map(s => `<option value="${s.code}">${s.code} ${s.name}</option>`).join("");
  sel.value = state.area;
  const lang = document.getElementById("lang"), on = lang.querySelector(`[data-lang="${state.lang}"]`);
  lang.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b === on));
  const ind = lang.querySelector(".ind"); ind.style.width = on.offsetWidth + "px"; ind.style.transform = `translateX(${on.offsetLeft - 2}px)`;
}
function setLang(l) {
  if (l === state.lang) return;
  state.lang = l;
  try { localStorage.setItem("klin-lang", l); } catch (e) {}
  applyStatic(); renderNav(); syncNav(false); renderTopbar();
  const cur = document.querySelector("#viewport .view:not(.leave)");
  if (state.view === "map") {
    cur.querySelector("[data-tab=legend]").textContent = tr("Legend");
    cur.querySelector("[data-tab=list]").textContent = tr("List");
    renderPanel(); syncTray(); if (ML) mlPaint();
  } else {
    const scroll = cur.scrollTop;
    cur.innerHTML = viewHTML(state.view); cur.scrollTop = scroll;
    cur.querySelectorAll(".bars[data-fluid]").forEach(c => fluid(c, ".bar-row"));
    hydrate(cur, false);
  }
}
function closeNav() { document.getElementById("app").classList.remove("nav-open"); }

/* ---------- init ---------- */
(function init() {
  document.getElementById("menuBtn").innerHTML = icon("list");
  document.getElementById("areaChev").innerHTML = icon("chevron");
  const sel = document.getElementById("areaSel");
  sel.addEventListener("change", e => setArea(e.target.value));
  document.getElementById("lang").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
  document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("app").classList.add("nav-open"));
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (state.view === "map" && state.area !== "KL") setArea("KL"); closeNav(); } });

  document.addEventListener("click", e => {
    const t = e.target;
    const v = t.closest("[data-view]"); if (v) return go(v.dataset.view);
    const a = t.closest("[data-area]"); if (a) { closeNav(); if (state.view === "about" || state.view === "overview") go("map"); return setArea(a.dataset.area); }
    const g = t.closest("[data-go]"); if (g) { if (g.classList.contains("bc") && state.area !== "KL") setArea("KL"); return go(g.dataset.go); }
    const p = t.closest("[data-pick]"); if (p) { if (p.closest("svg")?.dataset.dragged) return; return setArea(p.dataset.pick === state.area && state.view === "map" ? "KL" : p.dataset.pick); }
    const L = t.closest("[data-layer]"); if (L) { const prev = snapshot(); state.layer = L.dataset.layer; renderPanel(); paintMap(); syncNav(); continuity(prev); return; }
    const pt = t.closest("[data-point]"); if (pt) { state.points[pt.dataset.point] = !state.points[pt.dataset.point]; pt.setAttribute("aria-pressed", state.points[pt.dataset.point]); return mlPaint(); }
    const tab = t.closest("[data-tab]"); if (tab) { state.tab = tab.dataset.tab; return renderPanel(); }
    if (t.closest("#moreBtn")) { state.moreOpen = !state.moreOpen; const mb = document.querySelector(".more-body"); mb.classList.toggle("open", state.moreOpen); t.closest("#moreBtn").textContent = tr(state.moreOpen ? "Show less" : "Show more"); t.closest("#moreBtn").setAttribute("aria-expanded", state.moreOpen); return; }
    if (t.closest("#trayClose")) return setArea("KL");
  });

  try { const saved = localStorage.getItem("klin-area"); if (saved && (saved === "KL" || seatBy(saved))) state.area = saved; } catch (e) {}
  try { const l = localStorage.getItem("klin-lang"); if (l === "bm" || l === "en") state.lang = l; } catch (e) {}
  const h = location.hash.slice(1); if (VIEW_ORDER.includes(h)) state.view = h;
  applyStatic(); renderNav(); renderTopbar(); mountView(state.view, 1); syncNav(false);
  window.addEventListener("resize", () => { syncNav(false); applyStatic(); if (document.getElementById("tabInd")) { renderPanel(); applyZoom(); } });
})();
</script>
